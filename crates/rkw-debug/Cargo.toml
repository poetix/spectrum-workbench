[package]
name = "rkw-debug"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Debugger core: breakpoints, watchpoints and execution control for the z80 core"

[dependencies]
# Cache padding, per ADR-0010: the table is per target and belongs upstream,
# not in a `#[repr(align(128))]` justified by this laptop's cache line.
crossbeam-utils = "0.8"
z80 = { path = "../z80" }

[dev-dependencies]
alloc-check = { path = "../alloc-check" }

[lints]
workspace = true
