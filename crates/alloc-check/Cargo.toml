[package]
name = "alloc-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A counting global allocator, for tests that assert a code path does not allocate"
publish = false

# Deliberately does not inherit `[workspace.lints]`: that table forbids
# `unsafe_code`, and `forbid` cannot be lifted by an inner `allow`. The one
# `unsafe impl GlobalAlloc` this needs is why the crate exists and why it is a
# dev-dependency of nothing that ships.

