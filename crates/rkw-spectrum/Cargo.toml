[package]
name = "rkw-spectrum"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The 48K Spectrum: memory map, ULA, screen and frame timing"

[dependencies]
# The speaker's edge log, and everything that turns it into sound. The
# dependency points this way because the machine is what makes the edges and
# the audio crate is what must never learn a sample rate from it (ADR-0021).
rkw-audio = { path = "../rkw-audio" }
# The `Machine` trait the emulation thread runs against (ADR-0007). The
# dependency points this way because the ULA is what implements the schedule
# the slice loop asks about, and the debugger cannot be made to know about
# hardware it is meant to outlive.
rkw-debug = { path = "../rkw-debug" }
# TAP blocks and the waveform they stand for. Points this way for the same
# reason rkw-audio does: the machine is what has a tape deck in it, and a crate
# that cannot name a `Spectrum` cannot end up holding a piece of one
# (ADR-0022).
rkw-tape = { path = "../rkw-tape" }
z80 = { path = "../z80" }

[dev-dependencies]
alloc-check = { path = "../alloc-check" }

[lints]
workspace = true
